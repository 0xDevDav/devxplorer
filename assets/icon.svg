<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A Finder-like folder with a lens that reveals a photo inside: "see inside" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4ff"/><stop offset="1" stop-color="#dcd6fb"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9f92ff"/><stop offset="1" stop-color="#7c6bff"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3a8ff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0d3"/><stop offset="1" stop-color="#ff6f9e"/></linearGradient>
    <clipPath id="lens"><circle cx="600" cy="560" r="150"/></clipPath>
    <filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b2a8a" flood-opacity=".35"/></filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <g filter="url(#s)">
    <path d="M196 330a56 56 0 0 1 56-56h168l56 60h296a56 56 0 0 1 56 56v40H196z" fill="url(#back)"/>
    <path d="M196 410h632v330a60 60 0 0 1-60 60H256a60 60 0 0 1-60-60z" fill="url(#front)"/>
  </g>
  <g clip-path="url(#lens)">
    <rect x="440" y="400" width="320" height="320" fill="url(#photo)"/>
    <circle cx="660" cy="480" r="34" fill="#fff" opacity=".85"/>
    <path d="M440 720l120-130 80 70 70-60 50 50v70z" fill="#fff" opacity=".6"/>
  </g>
  <circle cx="600" cy="560" r="150" fill="none" stroke="#fff" stroke-width="34"/>
  <path d="M712 676l110 110" stroke="#fff" stroke-width="56" stroke-linecap="round"/>
</svg>
