<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src file: data:; media-src file:">
  <title>Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <div class="brand">Explorer</div>
    <div id="tabs"></div>
  </header>

  <div id="toolbar">
    <nav id="crumbs"></nav>
    <input id="q" type="search" placeholder="Cerca…">
    <select id="sort" title="Ordina"><option value="name">Nome</option><option value="date">Più recenti</option></select>
    <select id="group" title="Raggruppa">
      <option value="none">Nessun gruppo</option>
      <option value="day">Per giorno</option>
      <option value="month">Per mese</option>
      <option value="kind">Per tipo</option>
      <option value="extension">Per estensione</option>
    </select>
    <button id="settingsBtn" title="Impostazioni" aria-label="Impostazioni"></button>
  </div>

  <nav id="places">
    <div id="favs" class="place-group" aria-label="Preferiti"></div>
    <span class="divider"></span>
    <div id="drives" class="place-group" aria-label="Questo PC"></div>
    <div id="extfilters"></div>
  </nav>

  <main id="main">
    <div id="folders" hidden></div>
    <div id="content"></div>
  </main>

  <div id="menu" hidden></div>
  <div id="viewer"></div>

  <dialog id="ask">
    <form method="dialog">
      <label id="askLabel" for="askInput"></label>
      <input id="askInput" autocomplete="off">
      <menu><button value="ok" class="primary">OK</button><button value="cancel">Annulla</button></menu>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <h3>Aspetto</h3>
      <div id="themePicker" class="segmented"></div>
      <h3 class="section">Estensioni</h3>
      <p class="hint">Attiva solo quelle che servono al tuo lavoro. Disattivarle non cancella i dati.</p>
      <div id="extList"></div>
      <h3 class="section">Dati</h3>
      <p class="hint">Stati e tag dei file sono legati al loro contenuto: restano anche se i file vengono spostati o rinominati, e si possono condividere con chi ha gli stessi file.</p>
      <div class="actions">
        <button type="button" id="exportBtn">Esporta libreria…</button>
        <button type="button" id="importBtn">Importa libreria…</button>
      </div>
      <menu><button value="ok" class="primary" autofocus>Fatto</button></menu>
    </form>
  </dialog>

  <div id="toast" hidden></div>

  <script src="app.js"></script>
  <script src="extensions/social.js"></script>
  <script src="extensions/tags.js"></script>
</body>
</html>
