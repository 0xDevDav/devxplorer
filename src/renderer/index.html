<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'wasm-unsafe-eval'; img-src file: data: blob:; media-src file:">
  <title>DevXplorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <div id="tabs"></div>
  </header>

  <div id="toolbar">
    <div class="history">
      <button id="backBtn" data-i18n-title="nav.back"></button>
      <button id="forwardBtn" data-i18n-title="nav.forward"></button>
    </div>
    <nav id="crumbs"></nav>
    <label class="search"><input id="q" type="search" data-i18n-placeholder="search.placeholder" spellcheck="false"></label>
    <div id="viewSwitch" class="segmented">
      <button data-view="icons" data-i18n-title="view.icons"></button>
      <button data-view="list" data-i18n-title="view.list"></button>
    </div>
    <button id="sort" class="popup" data-i18n-title="sort.title"></button>
    <button id="group" class="popup" data-i18n-title="group.title"></button>
    <button id="settingsBtn" data-i18n-title="settings.title"></button>
  </div>

  <nav id="places">
    <div id="favs" class="place-group" data-i18n-title="places.favorites"></div>
    <span class="divider"></span>
    <div id="drives" class="place-group" data-i18n-title="places.pc"></div>
    <div id="extfilters"></div>
  </nav>

  <main id="main">
    <div id="folders" role="listbox" hidden></div>
    <div id="splitter" role="separator" aria-orientation="vertical"></div>
    <div id="content"></div>
  </main>

  <footer id="status"><span id="statusLeft"></span><span id="statusRight"></span></footer>

  <div id="menu" hidden></div>
  <div id="tooltip" role="tooltip"></div>
  <div id="viewer"></div>

  <dialog id="ask">
    <form method="dialog">
      <label id="askLabel" for="askInput"></label>
      <input id="askInput" autocomplete="off">
      <menu><button value="ok" class="primary" data-i18n="dialog.ok"></button><button value="cancel" data-i18n="dialog.cancel"></button></menu>
    </form>
  </dialog>

  <dialog id="alert" role="alertdialog" aria-describedby="alertText">
    <form method="dialog">
      <img class="alert-icon" src="../../assets/icon.png" alt="">
      <p id="alertText"></p>
      <menu><button value="ok" class="primary" autofocus data-i18n="dialog.ok"></button></menu>
    </form>
  </dialog>

  <dialog id="renameSheet">
    <form method="dialog">
      <h3 id="renameTitle"></h3>
      <div id="renameMode"></div>
      <div id="renameFields"></div>
      <p id="renamePreview" class="hint"></p>
      <menu><button value="ok" class="primary" data-i18n="rename.apply"></button><button value="cancel" data-i18n="dialog.cancel"></button></menu>
    </form>
  </dialog>

  <dialog id="infoSheet">
    <form method="dialog">
      <div id="infoBody"></div>
      <menu><button value="ok" class="primary" data-i18n="dialog.done"></button></menu>
    </form>
  </dialog>

  <dialog id="palette">
    <div class="palette-box">
      <input id="paletteInput" autocomplete="off" spellcheck="false" data-i18n-placeholder="palette.placeholder">
      <div id="paletteList"></div>
      <p class="hint palette-hint" data-i18n="palette.hint"></p>
    </div>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <nav class="settings-nav">
        <button type="button" data-pane="general"><span class="tile gray" data-icon="gear"></span><span data-i18n="settings.general"></span></button>
        <button type="button" data-pane="appearance"><span class="tile blue" data-icon="appearance"></span><span data-i18n="settings.appearance"></span></button>
        <button type="button" data-pane="extensions"><span class="tile green" data-icon="extensions"></span><span data-i18n="extensions.title"></span></button>
        <button type="button" data-pane="keyboard"><span class="tile indigo" data-icon="keyboard"></span><span data-i18n="keys.title"></span></button>
        <button type="button" data-pane="library"><span class="tile orange" data-icon="library"></span><span data-i18n="settings.library"></span></button>
      </nav>
      <div class="settings-body" tabindex="-1" autofocus>
        <section class="pane" data-pane="general">
          <h2 data-i18n="settings.general"></h2>
          <div class="set-group">
            <div class="set-row"><span data-i18n="settings.language"></span><div id="languagePicker" class="segmented"></div></div>
          </div>
          <div class="set-group">
            <label class="set-row">
              <div><span data-i18n="shell.title"></span><p class="hint" data-i18n="shell.hint"></p></div>
              <input type="checkbox" id="shellToggle"><span class="switch"></span>
            </label>
          </div>
          <div class="set-group">
            <div class="set-row">
              <div><span data-i18n="log.title"></span><p class="hint" data-i18n="log.hint"></p></div>
              <div class="set-actions"><button type="button" id="logBtn" data-i18n="log.show"></button></div>
            </div>
          </div>
        </section>
        <section class="pane" data-pane="appearance">
          <h2 data-i18n="settings.appearance"></h2>
          <div class="set-group">
            <div class="set-row"><span data-i18n="settings.theme"></span><div id="themePicker" class="segmented"></div></div>
            <div class="set-row"><span data-i18n="settings.accent"></span><div id="accentPicker" class="swatches"></div></div>
            <label id="glassRow" class="set-row" hidden>
              <div><span data-i18n="glass.title"></span><p class="hint" data-i18n="glass.hint"></p></div>
              <input type="checkbox" id="glassToggle"><span class="switch"></span>
            </label>
          </div>
        </section>
        <section class="pane" data-pane="extensions">
          <h2 data-i18n="extensions.title"></h2>
          <p class="hint lead" data-i18n="extensions.hint"></p>
          <div id="extList" class="set-group"></div>
        </section>
        <section class="pane" data-pane="keyboard">
          <h2 data-i18n="keys.title"></h2>
          <div id="shortcutList"></div>
        </section>
        <section class="pane" data-pane="library">
          <h2 data-i18n="settings.library"></h2>
          <p class="hint lead" data-i18n="data.hint"></p>
          <div class="set-group">
            <div class="set-row">
              <span data-i18n="data.backup"></span>
              <div class="set-actions">
                <button type="button" id="importBtn" data-i18n="data.import"></button>
                <button type="button" id="exportBtn" data-i18n="data.export"></button>
              </div>
            </div>
          </div>
        </section>
        <menu><button value="ok" class="primary" data-i18n="dialog.done"></button></menu>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="../shared/messages.js"></script>
  <script src="../shared/rename.js"></script>
  <script src="app.js"></script>
  <script src="media-controls.js"></script>
  <script src="previewers.js"></script>
  <script src="mesh.js"></script>
  <script src="viewer3d.js"></script>
  <script src="pdfviewer.js"></script>
  <script src="extensions/social.js"></script>
  <script src="extensions/tags.js"></script>
</body>
</html>
