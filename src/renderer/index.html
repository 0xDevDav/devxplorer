<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src file: data:; media-src file:">
  <title>DevXplorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="titlebar">
    <div class="brand">DevXplorer</div>
    <div id="tabs"></div>
  </header>

  <div id="toolbar">
    <nav id="crumbs"></nav>
    <label class="search"><input id="q" type="search" data-i18n-placeholder="search.placeholder" spellcheck="false"></label>
    <button id="sort" class="popup" data-i18n-title="sort.title"></button>
    <button id="group" class="popup" data-i18n-title="group.title"></button>
    <button id="settingsBtn" data-i18n-title="settings.title"></button>
  </div>

  <nav id="places">
    <div id="favs" class="place-group" data-i18n-title="places.favorites"></div>
    <span class="divider"></span>
    <div id="drives" class="place-group" data-i18n-title="places.pc"></div>
    <div id="extfilters"></div>
  </nav>

  <main id="main">
    <div id="folders" hidden></div>
    <div id="splitter" role="separator" aria-orientation="vertical"></div>
    <div id="content"></div>
  </main>

  <footer id="status"><span id="statusLeft"></span><span id="statusRight"></span></footer>

  <div id="menu" hidden></div>
  <div id="tooltip" role="tooltip"></div>
  <div id="viewer"></div>

  <dialog id="ask">
    <form method="dialog">
      <label id="askLabel" for="askInput"></label>
      <input id="askInput" autocomplete="off">
      <menu><button value="ok" class="primary" data-i18n="dialog.ok"></button><button value="cancel" data-i18n="dialog.cancel"></button></menu>
    </form>
  </dialog>

  <dialog id="palette">
    <div class="palette-box">
      <input id="paletteInput" autocomplete="off" spellcheck="false" data-i18n-placeholder="palette.placeholder">
      <div id="paletteList"></div>
      <p class="hint palette-hint" data-i18n="palette.hint"></p>
    </div>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <h3 data-i18n="settings.appearance"></h3>
      <div id="themePicker" class="segmented"></div>
      <div id="accentPicker" class="swatches"></div>
      <label id="glassRow" class="ext-row glass-row" hidden>
        <div><b data-i18n="glass.title"></b><p class="hint" data-i18n="glass.hint"></p></div>
        <input type="checkbox" id="glassToggle"><span class="switch"></span>
      </label>
      <h3 class="section" data-i18n="settings.language"></h3>
      <div id="languagePicker" class="segmented"></div>
      <h3 class="section" data-i18n="settings.integration"></h3>
      <label class="ext-row">
        <div><b data-i18n="shell.title"></b><p class="hint" data-i18n="shell.hint"></p></div>
        <input type="checkbox" id="shellToggle"><span class="switch"></span>
      </label>
      <h3 class="section" data-i18n="extensions.title"></h3>
      <p class="hint" data-i18n="extensions.hint"></p>
      <div id="extList"></div>
      <h3 class="section" data-i18n="data.title"></h3>
      <p class="hint" data-i18n="data.hint"></p>
      <div class="actions">
        <button type="button" id="exportBtn" data-i18n="data.export"></button>
        <button type="button" id="importBtn" data-i18n="data.import"></button>
      </div>
      <menu><button value="ok" class="primary" autofocus data-i18n="dialog.done"></button></menu>
    </form>
  </dialog>

  <div id="toast" hidden></div>

  <script src="../shared/messages.js"></script>
  <script src="app.js"></script>
  <script src="media-controls.js"></script>
  <script src="previewers.js"></script>
  <script src="mesh.js"></script>
  <script src="viewer3d.js"></script>
  <script src="extensions/social.js"></script>
  <script src="extensions/tags.js"></script>
</body>
</html>
